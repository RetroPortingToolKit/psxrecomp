# bios/SCPH5501.toml — BIOS build profile for the retail Sony SCPH-5501 image (NTSC-U, v3.0).
#
# Generated by tools/add_retail_bios.py from bios/SCPH1001.toml.
#
# WHY THIS PROFILE MAY CARRY SCPH-1001'S ADDRESS MODEL
# ----------------------------------------------------
# ROM [0x00000, 0x18000) — boot, Kernel Part 1 and Kernel Part 2 — was
# compared byte-for-byte against bios/SCPH1001.BIN and is IDENTICAL.
#   reference  CRC32 37157331  SHA-256 71af94d1e47a68c11e8fdb9f8368040601514a42a5a399cda48c7d3bff1e99d3
#   this image CRC32 8D8CB7E4  SHA-256 11052b6499e466bbf0a709b1f9cb6834a9418e66680387912451e971cf8a1fef
#
# Everything below that describes the kernel is therefore a statement
# about bytes this image demonstrably has: the copy windows, every
# install slot (RAM 0x500..0x8500 is sourced from Kernel Part 2), and
# both HLE anchors (LoadRunShell at ROM 0x6FF0; the DeliverEvent jalr
# at kernel RAM 0x1718 -> ROM 0x11218).
#
# The shell (ROM 0x18000+) differs, as it does on every regional image.
# Its functions are absent from the seed corpus and run through the
# dirty-RAM interpreter, exactly as on SCPH-101 and SCPH-5552.
#
# EVIDENCE LIMIT: the install slots were measured on a live SCPH-1001
# boot (see bios/SCPH1001.toml). They are carried here on the byte
# identity above, NOT re-measured on a live boot of this image.

[program]
name         = "Sony SCPH-5501 BIOS"
id           = "SCPH-5501"
rom          = "bios/SCPH5501.BIN"
load_address = "0xBFC00000"
entry_pc     = "0xBFC00000"
text_size    = "0x00080000"

# Declared identity. The emitter refuses to generate from any other
# image (main_bios.cpp's declared-identity gate). Without this pin a
# wrong-revision dump generates silently and wild-jumps at run time.
[program.image]
sha256          = "11052b6499e466bbf0a709b1f9cb6834a9418e66680387912451e971cf8a1fef"
license         = "proprietary"
redistributable = false

[recompiler]
seeds    = "recompiler/seeds/phase2_ghidra_seeds_SCPH5501.json"
out_dir  = "generated"
out_stem = "SCPH5501"
strict   = true

# Carried verbatim from bios/SCPH1001.toml. Bounds are [lo, hi) with hi
# EXCLUSIVE. Do NOT widen the shell window here: that profile records
# widening it as a real behaviour change needing its own evidence.
[recompiler.address_model]
normalize_mask = "0x1FFFFFFF"

[[recompiler.address_model.copy]]
name         = "Kernel Part 2"
rom_lo       = "0x1FC10000"
rom_hi       = "0x1FC18000"
ram_lo       = "0x00000500"
runtime_base = "0x00000500"
dispatch_key = "ram"
kernel_bless = true

[[recompiler.address_model.copy]]
name         = "Shell"
rom_lo       = "0x1FC18000"
rom_hi       = "0x1FC43000"
ram_lo       = "0x00030000"
runtime_base = "0x80030000"
dispatch_key = "rom"
kernel_bless = false

# Kernel-RAM ranges the guest's Psy-Q libapi patchers overwrite at
# run time. Sourced from Kernel Part 2, which is byte-identical
# above, so the same ranges hold. Re-measure per SDK version.

[[recompiler.install_slots]]
ram_addr = "0x00000C88"
len      = "0x30"
resume   = "fallthrough"

[[recompiler.install_slots]]
ram_addr = "0x00000CF0"
len      = "0x10"
resume   = "jalr"

[[recompiler.install_slots]]
ram_addr = "0x00004964"
len      = "0x2C"
resume   = "fallthrough"

[[recompiler.install_slots]]
ram_addr = "0x00004D98"
len      = "0x14"
resume   = "fallthrough"

[[recompiler.install_slots]]
ram_addr = "0x00006444"
len      = "0x10"
resume   = "none"

# Per-image HLE anchors couriered into the generated C. Both live
# inside the verified range. Omitting a key makes that HLE feature
# structurally unavailable rather than firing on a wrong address.
[recompiler.runtime_exports]
shell_entry_phys  = "0x00030000"
deliver_event_ret = "0x80001720"
